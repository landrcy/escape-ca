 $('score').textContent=`${CAST[who].n} survived ${((now-t0)/1000).toFixed(1)}s`;$('overline').textContent=by=='v'?'verity was never landry.':'julian has finded '+CAST[who].n.toLowerCase()+'.';
 if(!RM){$('over').classList.add('strobe');document.body.classList.add('shake')}}

let last=performance.now(),fr=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const tt=now/1000;fr+=dt;
 lamps.forEach(l=>{const u=l.userData;l.intensity=u.dead?(Math.random()<.04?7:0):7+Math.sin(tt*11+u.b)*1.2-(Math.random()<.02?7:0)});
 const frame=Math.floor(fr*10)%6;[jul,me].forEach(s=>s&&(s.userData.t.offset.x=frame/6));
 let dist=99;
 if(state=='play'&&now>frozenUntil){
  if(keys.q||keys.arrowleft)P.yaw+=2.2*dt;if(keys.e||keys.arrowright)P.yaw-=2.2*dt;
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d?1:0)-(keys.a?1:0),fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),v=CAST[who].spd*dt*(keys.shift?1.25:1);
  move(P,(fx*f-fz*s)*v,(fz*f+fx*s)*v,.4);
  spd=Math.min(5.4,spd+dt*.03);const step=(M,sp)=>{const[tx,tz]=nextStep(M),dx=tx-M.x,dz=tz-M.z,d=Math.hypot(dx,dz)||1;move(M,dx/d*sp*dt,dz/d*sp*dt,.3)};step(J,spd);
  const el=(now-t0)/1000;if(!V.on&&el>45){V.on=true;ver.visible=true;showZone('SHE IS HERE TOO')}
  if(V.on)step(V,spd*.8);
  dist=Math.hypot(P.x-J.x,P.z-J.z);const vd=V.on?Math.hypot(P.x-V.x,P.z-V.z):99;
  const z=zoneAt(Math.round(P.x/S),Math.round(P.z/S));if(z!=lastZone){lastZone=z;showZone(z)}
  // jumpscares: close range OR blind corner (julian suddenly in sight, near)
  const seen=dist<9&&los(P,J),cool=tt-lastScare>10;
  if(cool&&(dist<3||(seen&&!jSeen&&dist<7)))jumpscare('j',now);
  else if(cool&&vd<3)jumpscare('v',now);
  jSeen=seen;
  $('hud').textContent=`${CAST[who].n} · ${el.toFixed(1)}s · ${z} · JULIAN ${dist.toFixed(0)}m${V.on?` · VERITY ${vd.toFixed(0)}m`:''}`;
  const near=Math.min(dist,vd);$('vig').style.setProperty('--r',Math.max(0,(14-near)*16)+'px');
  cam.fov+=((near<8?54:68)-cam.fov)*dt*2;cam.updateProjectionMatrix();
  if(drone)drone.gain.value=.03+Math.max(0,(12-near))*.006;
  if(ac&&ac.currentTime>nextBeat){thump(55,.6);setTimeout(()=>thump(45,.4),130);nextBeat=ac.currentTime+Math.max(.28,Math.min(1.4,near/8))}
  if(Math.random()<dt*.04)distantScream();
  if(dist<1.1)gotcha(now,'j');else if(vd<1.1)gotcha(now,'v');
 }
 if(state!='play'&&state!='over'){renderer.render(scene,cam);return}
 const bob=RM?0:Math.sin(tt*9)*.05;
 if(me){me.position.set(P.x,.95+bob,P.z);const mv=keys.w||keys.s||keys.a||keys.d||keys.arrowup||keys.arrowdown;if(!mv)me.userData.t.offset.x=0}
 jul.position.set(J.x,1.3+(RM?0:Math.random()*.04),J.z);jl.position.set(J.x,1.8,J.z);ver.position.set(V.x,1.2,V.z);
 const back=3,cx=P.x+Math.sin(P.yaw)*back,cz=P.z+Math.cos(P.yaw)*back;let k=1;for(;k>.2&&hit(P.x+(cx-P.x)*k,P.z+(cz-P.z)*k,.15);k-=.1);
 const sh=(!RM&&dist<6)?(6-dist)*.02:0;
 cam.position.set(P.x+(cx-P.x)*k+(Math.random()-.5)*sh,2.1,P.z+(cz-P.z)*k+(Math.random()-.5)*sh);cam.lookAt(P.x-Math.sin(P.yaw),1.3,P.z-Math.cos(P.yaw));
 flash.position.copy(cam.position);flash.target.position.set(P.x-Math.sin(P.yaw)*8,.8,P.z-Math.cos(P.yaw)*8);flash.intensity=(Math.random()<.015&&!RM)?4:30;
 renderer.render(scene,cam)}
requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
